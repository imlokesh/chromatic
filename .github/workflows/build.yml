name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.cjs
      - run: node scripts/features-smoke.cjs
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: chromatic-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
